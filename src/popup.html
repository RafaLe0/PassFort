<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>PassFort</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h2>PassFort</h2>
  <p class="subtitle">Password strength & breach scanner</p>

  <div class="input-container">
    <input type="password" id="passwordInput" placeholder="Enter or generate a password" autocomplete="off" />
    <button id="toggleVisibilityBtn" class="icon-btn" title="Show / Hide">👁️</button>
    <button id="copyBtn" class="icon-btn" title="Copy to clipboard">📋</button>
  </div>

  <div class="buttons">
    <button id="checkBtn">Analyze</button>
    <button id="generateBtn">Generate</button>
  </div>

  <div id="result" class="result">Enter a password to begin.</div>

  <footer>
    <small>Powered by <span class="accent">Have I Been Pwned</span></small>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
